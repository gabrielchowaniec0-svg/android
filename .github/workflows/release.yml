# Every time something is merged into main, this builds a signed release APK and
# publishes it as a GitHub Release. Kinetic's in-app updater picks it up from there.
#
# One-time setup: add your keystore as the repository secret KINETIC_KEYSTORE_BASE64
# (see kinetic-launcher/docs/UPDATES.md). Without it, nothing is published.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kinetic-launcher
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check for signing key
        id: key
        env:
          KEY: ${{ secrets.KINETIC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "No KINETIC_KEYSTORE_BASE64 secret yet — skipping the release (see docs/UPDATES.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEY" | base64 -d > "$RUNNER_TEMP/kinetic.keystore"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.key.outputs.ok == 'true'
        env:
          KINETIC_KEYSTORE_FILE: ${{ runner.temp }}/kinetic.keystore
          KINETIC_KEYSTORE_PASSWORD: ${{ secrets.KINETIC_KEYSTORE_PASSWORD }}
          KINETIC_KEY_ALIAS: ${{ secrets.KINETIC_KEY_ALIAS }}
          KINETIC_KEY_PASSWORD: ${{ secrets.KINETIC_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Publish GitHub Release
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(( 1000 + $(git rev-list --count HEAD) ))
          TAG="kinetic-$CODE"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "Kinetic-$CODE.apk"
          NOTES=$(git log -1 --pretty=format:'%s%n%n%b' | sed '/^Co-Authored-By/d;/^Claude-Session/d')
          gh release create "$TAG" "Kinetic-$CODE.apk" --title "Kinetic build $CODE" --notes "$NOTES" --latest
